<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kool Kaya Kitchen</title>
  <meta name="description" content="Artisan kaya and coconut jam from Singapore, delivered across Asia-Pacific.">
  <link rel="icon" href="/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="promo-bar" id="promo-bar"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="brand" aria-label="Kool Kaya Kitchen home">
        <img src="/img/logo.webp" alt="" width="52" height="52">
        <span class="brand-text"><strong>Kool Kaya</strong><small>Kitchen</small></span>
      </a>
      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" aria-label="Search products">
      </form>
      <nav class="main-nav" id="main-nav"></nav>
      <div class="header-tools">
        <label class="select-pill" title="Market & currency">
          <select id="market-select" aria-label="Market"></select>
        </label>
        <label class="select-pill" title="Language">
          <select id="lang-select" aria-label="Language"></select>
        </label>
        <a href="#/account" class="icon-btn" id="account-link" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </a>
        <a href="#/cart" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
          <span class="badge" id="cart-count" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <img src="/img/logo.webp" alt="Kool Kaya Kitchen logo" width="72" height="72">
        <p id="footer-tag"></p>
      </div>
      <div class="footer-links">
        <a href="#/shop">Shop</a><a href="#/promotions">Promotions</a><a href="#/help">Help & FAQ</a><a href="#/account">My account</a>
      </div>
      <p class="muted small">© <span id="year"></span> Kool Kaya Kitchen Pte. Ltd. · 1 Kaya Lane, Singapore · Serving SG · MY · TH · HK</p>
    </div>
  </footer>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
